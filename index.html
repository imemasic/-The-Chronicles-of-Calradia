body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.11),transparent 30%,rgba(0,0,0,.16));}
button{font:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid #e7d19c;outline-offset:4px}
.app{position:relative;display:flex;flex-direction:column;align-items:center;min-height:100svh;height:100svh;padding:13px 14px 12px;overflow:hidden}
.topline{display:flex;align-items:center;justify-content:space-between;width:min(700px,100%);min-height:32px;z-index:9;flex:none}
.brand{color:#d3c8b2;font:600 11px/1.4 Arial,sans-serif;letter-spacing:.26em;text-transform:uppercase;opacity:.88}
.topactions{display:flex;align-items:center;gap:6px}
.roundbtn{width:32px;height:32px;display:grid;place-items:center;color:#c5c8cf;background:rgba(240,240,255,.035);border:1px solid rgba(255,255,255,.13);border-radius:50%;line-height:1;font-family:Arial,sans-serif;font-size:17px;transition:background .2s,border-color .2s}
.roundbtn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28)}
.content{position:relative;flex:1;min-height:0;width:100%;max-width:1150px;}
.card-stage{position:absolute;top:calc(50% - 17px);left:50%;transform:translate(-50%,-50%);width:100%;height:calc(var(--card-w) * 1.333333333);display:grid;place-items:center;isolation:isolate;}
.chapter{position:absolute;bottom:calc(100% + 141px);width:100%;text-align:center;color:rgba(216,212,210,.7);font:600 10px/1.2 Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap}

    }
    dom.card.classList.remove('is-leaving');dom.card.style.opacity='';dom.card.style.transform='';newChoiceLock=true;
    showDialog({kicker,title,body,small:`Принято решений: ${state.log.length} из ${maxTurns}.`,summary:K.map(k=>`<span title="${names[k]}"><b>${state.stats[k]}</b></span>`).join(' · '),primary:'НАЧАТЬ ЗАНОВО',onPrimary:()=>hideDialog(()=>restart(true))});
  }
  function restart(skipDialog=false){
    if(!skipDialog){showDialog({kicker:'НОВАЯ ГЛАВА',title:'Начать заново?',body:'',primary:'НАЧАТЬ',secondary:'ОТМЕНА',onPrimary:()=>{restart(true);hideDialog()}});return;}
    state=freshState();store();dragging=false;newChoiceLock=false;cancelAnimationFrame(keyRAF);keyHeld=null;resetTilt();dom.stage.classList.remove('is-resolving');dom.card.classList.remove('is-leaving');dom.card.classList.add('is-entering');dom.card.style.opacity='';updateMeters();reveal();setTimeout(()=>dom.card.classList.remove('is-entering'),630);
  }
  document.getElementById('restartBtn').addEventListener('click',()=>restart(false));
  document.getElementById('infoBtn').addEventListener('click',()=>showDialog({kicker:'КАК ИГРАТЬ',title:'Четыре опоры власти',body:'Советник Фиан будет предлагать решения. Наклони его карточку влево или вправо, чтобы увидеть ответ. Доведи наклон до конца и отпусти — тогда решение сработает. Продержись 24 года правления, чтобы победить. Если хотя бы одна шкала упадёт до нуля, ты проиграешь.',primary:'ИГРАТЬ',onPrimary:hideDialog}));
  window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!dom.overlay.hidden&&!state.ended){hideDialog();}});
  // Facial animation: separate blinking and rare, brief eye movements.
  const eyes=[...document.querySelectorAll('.eye')];
  let eyeActive=true;
  function glance(){
    if(!eyeActive)return;
    const directions=[[0,0],[-.45,0],[.45,0],[0,-.20],[0,.22],[-.3,-.12],[.3,.12]];
    const [x,y]=directions[Math.floor(Math.random()*directions.length)];
    eyes.forEach(eye=>{eye.style.setProperty('--eye-x',`${x*100}%`);eye.style.setProperty('--eye-y',`${y*100}%`);});
    setTimeout(()=>eyes.forEach(eye=>{eye.style.setProperty('--eye-x','0%');eye.style.setProperty('--eye-y','0%');}),850+Math.random()*650);
    setTimeout(glance,7200+Math.random()*8000);
  }
  function blink(){
    if(!eyeActive)return;
    eyes.forEach(eye=>eye.style.setProperty('--eye-blink','.08'));
    setTimeout(()=>eyes.forEach(eye=>eye.style.setProperty('--eye-blink','1')),150);
    setTimeout(blink,4700+Math.random()*6200);
  }
  setTimeout(glance,4300);setTimeout(blink,5600);
  state=load();updateMeters();reveal();
  if(state.ended){const lost=K.find(k=>state.stats[k]<=0);setTimeout(()=>showEnding(lost,lost?state.stats[lost]:0),300);}
  setTimeout(()=>dom.card.classList.remove('is-entering'),700);
})();
</script>
</body>
